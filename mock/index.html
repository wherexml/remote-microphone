<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Microphone</title>
<style>
:root{--blue:#3388ff;--blue-end:#4c94ff;--ink:#20232a;--muted:#7d8490;--line:#e8eaf0;--surface:#f6f7fa;--pale:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:#edf0f5;color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;gap:60px;align-items:center;min-height:100vh;padding:40px;flex-wrap:wrap}.phone,.mac{background:white;border:1px solid var(--line);border-radius:24px;padding:30px;width:350px;box-shadow:0 12px 40px #2436520a}.phone{min-height:720px;display:flex;flex-direction:column}.top{display:flex;gap:12px;justify-content:space-between;align-items:center}h1{font-size:20px;letter-spacing:-.6px;line-height:1.25;margin:0;font-weight:650;white-space:nowrap}.status{margin-top:65px;color:var(--muted);font-size:15px}.target{font-size:28px;letter-spacing:-.6px;font-weight:600;margin:12px 0 0}.meter{display:flex;gap:5px;align-items:center;justify-content:center;height:70px;margin:50px 0}.meter i{display:block;width:5px;border-radius:8px;background:#d8dde6;height:5px}.live .meter i{background:var(--blue)}button{font:inherit;cursor:pointer;border:0;background:var(--surface);color:var(--ink);border-radius:12px;height:44px;padding:0 18px}button:hover{filter:brightness(.98)}button:focus-visible,select:focus-visible{outline:3px solid #3388ff55;outline-offset:3px}.icon{width:36px;height:36px;display:grid;place-items:center;padding:0;flex-shrink:0;color:var(--blue);background:var(--pale)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.record{width:100px;height:100px;border-radius:50%;align-self:center;background:linear-gradient(135deg,var(--blue),var(--blue-end));color:white;box-shadow:0 8px 24px #3388ff26;display:grid;place-items:center}.record svg{width:34px;height:34px}.label{text-align:center;margin-top:20px;color:var(--muted)}.phone footer{margin-top:auto;padding-top:30px;color:#9097a2;font-size:13px;text-align:center;display:flex;gap:6px;align-items:center;justify-content:center}.phone footer svg{width:13px;height:13px}.desktop{display:flex;flex-direction:column;gap:24px;align-items:center}.mac{border-radius:20px;padding-top:18px}.traffic{display:flex;gap:7px;margin-bottom:24px}.traffic i{height:10px;width:10px;border-radius:50%;background:#e3e5e9}.mac .target{font-size:19px;margin-top:26px;letter-spacing:0}.mac .status{margin:8px 0 0;font-size:14px}.mac .meter{margin:28px 0}.device{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-radius:12px}.device svg{color:var(--muted);width:18px;flex-shrink:0}.mac select{width:100%;height:46px;color:var(--ink);background:transparent;border:0;font:inherit;outline-offset:4px}.primary{width:100%;margin-top:20px;background:linear-gradient(115deg,var(--blue),var(--blue-end));color:white;font-weight:600;height:46px}.actions{display:flex;gap:8px}.pair{padding:24px;border:1px solid var(--line);border-radius:20px;max-width:360px;color:var(--ink)}.pair::backdrop{background:#19233533}.pair input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:20px 0 0}.pair h2{font-size:20px;margin:0}.pair .top button{height:32px}.pair form{margin:0}@media(max-width:600px){body{padding:16px;gap:28px}.phone,.mac{max-width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<svg style="display:none"><symbol id="mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol><symbol id="qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h4v4h-7v-3M21 14v1"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol></svg>
<section class="phone"><div class="top"><h1>Remote Microphone</h1><button class="icon pair-open" aria-label="配对"><svg><use href="#qr"/></svg></button></div><div class="status" id="state">已连接</div><div class="target">Mac Studio</div><div style="font-size:14px;color:var(--muted);margin-top:8px">mac.example.ts.net:48139</div><div class="meter" aria-label="音量"></div><button class="record" id="toggle" aria-label="开始录音"><svg><use href="#mic"/></svg></button><div class="label" id="label">开始</div><footer><svg><use href="#lock"/></svg>加密连接</footer></section>
<div class="desktop"><section class="mac"><div class="traffic"><i></i><i></i><i></i></div><div class="top"><h1>Remote Microphone</h1><div class="actions"><button class="icon pair-open" aria-label="Mac 配对"><svg><use href="#qr"/></svg></button></div></div><div class="target">iPhone</div><div class="status" id="mac-state">等待连接</div><div class="meter" aria-label="音量"></div><div class="device"><svg><use href="#mic"/></svg><select aria-label="音频设备"><option>BlackHole 2ch</option></select></div><button class="primary" id="stop">停止接收</button></section></div>
<dialog class="pair"><form method="dialog"><div class="top"><h2>连接 Mac</h2><button aria-label="关闭配对">×</button></div><button type="button" class="primary" onclick="this.textContent='将镜头对准 Mac 配对二维码'">扫描二维码</button><p style="color:var(--muted)">当前配对 · Mac Studio<br>mac.example.ts.net:48139</p><input placeholder="粘贴完整配对链接" aria-label="配对链接"><button class="primary">配对</button></form></dialog>
<script>document.querySelectorAll('.meter').forEach(x=>x.innerHTML='<i></i>'.repeat(24));let live=false,receiving=true;function render(){document.body.classList.toggle('live',live&&receiving);document.querySelector('#state').textContent=live?'传送中':'已连接';document.querySelector('#label').textContent=live?'停止':'开始';document.querySelector('#toggle').setAttribute('aria-label',live?'停止录音':'开始录音');document.querySelector('#toggle').innerHTML=live?'<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>':'<svg><use href="#mic"/></svg>';document.querySelector('#mac-state').textContent=receiving?(live?'传送中':'等待连接'):'已停止';document.querySelector('#stop').textContent=receiving?'停止接收':'开始接收'}document.querySelector('#toggle').onclick=()=>{live=!live;render()};document.querySelector('#stop').onclick=()=>{receiving=!receiving;if(!receiving)live=false;render()};document.querySelectorAll('.pair-open').forEach(b=>b.onclick=()=>document.querySelector('dialog').showModal());render();
// Explicit preview data only; the native waveform uses measured microphone RMS.
const history=Array(24).fill(0);let envelope=0,frame=0;
setInterval(()=>{const rms=live&&receiving ? .003+.017*(Math.sin(frame++*.13)+1)/2 : 0;const target=rms>0?Math.max(0,Math.min(1,(20*Math.log10(rms)+60)/42)):0;envelope=Math.max(target,envelope*.76);history.shift();history.push(envelope);document.querySelectorAll('.meter').forEach(m=>m.querySelectorAll('i').forEach((bar,i)=>bar.style.height=(5+(live&&receiving?history[i]:0)*60)+'px'));},1000/30);
</script></html>
